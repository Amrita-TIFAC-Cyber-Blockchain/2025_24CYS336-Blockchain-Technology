<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/loader.css" />
    <link href="./css/bootstrap.min.css" rel="stylesheet" />
    <script src="node_modules/web3/dist/web3.min.js"></script>
    <script src="js/App.js"></script>
    <script src="js/qrcode.min.js"></script>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"
      integrity="sha512-KfkfwYDsLkIlwQp6LFnl8zNdLGxu9YAA1QvwINks4PhcElQSvqcyVLLD9aMhXd13uQjoXtEKNosOWaZqXgel0g=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="css/main.css" />
    <link href="./css/aos.min.css" rel="stylesheet" />
    <link rel="icon" href="./assets/images/icon.png" />
    <title>Upload Document</title>
  </head>

  <body>
    <!-- Loader -->
    <div class="loader-wraper">
      <div class="lds-roller">
        <div></div><div></div><div></div><div></div>
        <div></div><div></div><div></div><div></div>
      </div>
    </div>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light py-3 navbar-dark">
      <div class="container">
        <a class="navbar-brand" href="index.html">
          <i class="fa-solid fa-dragon home_text"></i>
          <span class="home_text">Orio</span>Chain
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link active" href="upload.html">Upload</a></li>
            <li class="nav-item"><a class="nav-link" href="verify.html">Verify</a></li>
            <li class="nav-item"><a class="nav-link" href="delete.html">Delete</a></li>
            <li class="nav-item"><a class="nav-link" href="admin.html">Admin</a></li>
            <li class="nav-item"><a class="nav-link" href="about.html">Team</a></li>
          </ul>
          <div class="d-flex">
            <button id="loginButton" onclick="connect()" class="btn main-button">Login</button>
            <button id="logoutButton" onclick="disconnect()" class="btn main-button">Logout</button>
          </div>
        </div>
      </div>
    </nav>

    <!-- Upload Section -->
    <div class="container">
      <div class="alert alert-danger d-none mt-2">
        Please download MetaMask at
        <a target="_blank" href="https://metamask.io/download">Metamask Site</a>
      </div>

      <!-- Wallet Info -->
      <div class="row content m-1">
        <div data-aos="fade-down" class="box wallet-status col-lg-12 d-flex flex-column my-2">
          <i class="fa-brands fa-connectdevelop icon"></i>
          <span id="Exporter-info" class="p-1 mb-2"></span>
          <span id="userAddress" class="p-1"><span class="text-warning"></span></span>
          <span id="network" class="p-1"><span class="text-warning"></span></span>
          <span id="userBalance" class="p-1"><span class="text-warning"></span></span>
        </div>

        <!-- Upload Form -->
        <div data-aos="zoom-in" class="col py-3 data-upload my-3">
          <input onchange="get_Sha3()" id="doc-file" type="file" accept="application/pdf, image/*" />
          <span id="note" class="text-danger"></span>
          <img id="loader" class="d-none" src="files/loader.svg" alt="loader" />
          <input onclick="sendHash()" class="btn upload-button main-button" type="submit" value="Upload Document" id="upload_file_button" />
        </div>
      </div>

      <!-- Transaction Info -->
      <div data-aos="zoom-in" class="box gx-0 my-3 row mx-md-2 transaction-status col-lg">
        <div class="left col-md-6 p-3 d-flex flex-column">
          <span class="p-2 info" id="transaction-hash"></span>
          <span class="p-2 info" id="file-hash"></span>
          <span class="p-2 info" id="contract-address"></span>
          <span class="p-2 info" id="time-stamps"></span>
          <span class="p-2 info" id="blockNumber"></span>
          <span class="p-2 info" id="blockHash"></span>
          <span class="p-2 info" id="to-netowrk"></span>
          <span class="p-2 info" id="gas-used"></span>
          <span class="btn-container">
            <a title="Download QR Code" href="#" id="download-link" class="download-link" download="image.png">Download QR-CODE</a>
            <a target="_blank" title="Verify Document" href="#" id="verfiy" class="download-link">Verify Document</a>
          </span>
        </div>
        <div id="qrcode" class="col-md-6 mt-md-2 d-flex justify-content-center align-items-center"></div>
      </div>
    </div>

    <!-- Floating and Contact Buttons -->
    <i onclick="topFunction()" id="scroll-btn" class="fa-solid fa-angle-up"></i>
    <div>
      <a href="mailto:devaloshe@gmail.com?subject=From OrioChain Site">
        <i class="mail-us fa-solid fa-headset"></i>
      </a>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/aos.js"></script>
    <script src="./js/script.js"></script>
  </body>
</html>
