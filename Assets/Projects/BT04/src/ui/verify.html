<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/loader.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="./css/aos.min.css" rel="stylesheet" />
    <script src="./js/aos.js"></script>
    <script src="node_modules/web3/dist/web3.min.js"></script>
    <script src="js/App.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"
      integrity="sha512-KfkfwYDsLkIlwQp6LFnl8zNdLGxu9YAA1QvwINks4PhcElQSvqcyVLLD9aMhXd13uQjoXtEKNosOWaZqXgel0g=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="icon" href="./assets/images/icon.png" />
    <title>Verify Document</title>
  </head>

  <body>
    <!-- Loader -->
    <div class="loader-wraper">
      <div class="lds-roller">
        <div></div><div></div><div></div><div></div>
        <div></div><div></div><div></div><div></div>
      </div>
    </div>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-light py-3 navbar-dark">
      <div class="container">
        <a class="navbar-brand" href="index.html">
          <i class="fa-solid fa-dragon home_text"></i>
          <span class="home_text">Orio</span>Chain
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="upload.html">Upload</a></li>
            <li class="nav-item"><a class="nav-link active" href="verify.html">Verify</a></li>
            <li class="nav-item"><a class="nav-link" href="delete.html">Delete</a></li>
            <li class="nav-item"><a class="nav-link" href="admin.html">Admin</a></li>
            <li class="nav-item"><a class="nav-link" href="about.html">Team</a></li>
          </ul>
          <div class="d-flex">
            <button id="loginButton" onclick="connect()" class="btn main-button">Login</button>
            <button id="logoutButton" onclick="disconnect()" class="btn main-button">Logout</button>
          </div>
        </div>
      </div>
    </nav>

    <!-- Verification Section -->
    <div class="container">
      <!-- Upload form -->
      <div data-aos="zoom-in" class="col p-3 data-upload my-3 mx-md-2">
        <input onchange="get_Sha3()" id="doc-file" type="file" />
        <span id="note" class="text-danger"></span>
        <img id="loader" src="files/loader.svg" alt="loader" />
        <input
          onclick="verify_Hash()"
          class="btn mt-5 upload-button d-block main-button"
          type="button"
          value="Verify"
          id="upload_file_button"
        />
      </div>

      <!-- Verification result -->
      <div class="box d-none my-3 row gx-0 mx-md-2 transaction-status col-lg">
        <div class="left col-lg-6 p-3 d-flex flex-column">
          <span class="p-2 info text-center" id="doc-status"></span>
          <span class="p-2 info" id="file-hash"></span>
          <span class="p-2 info" id="contract-address"></span>
          <span class="p-2 info" id="time-stamps"></span>
          <span class="p-2 info" id="blockNumber"></span>
          <span class="p-2 info" id="college-name"></span>

          <span class="d-flex justify-content-center">
            <a
              title="View Certificate on IPFS"
              href="#"
              id="download-document"
              class="download-link"
              target="_blank"
            >
              View Certificate
            </a>
          </span>
        </div>
        <div class="right col-lg-6 d-flex justify-content-center align-items-center">
          <img class="mt-4" id="student-document" alt="Student document" />
        </div>
      </div>
    </div>

    <!-- Floating buttons -->
    <div>
      <a
        title="Send Email"
        href="mailto:devaloshe@gmail.com?subject=From OrioChain Site"
      >
        <i class="mail-us fa-solid fa-headset"></i>
      </a>
    </div>
    <i onclick="topFunction()" id="scroll-btn" class="fa-solid fa-angle-up"></i>

    <!-- Scripts -->
    <script src="./js/script.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
