<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/loader.css" />
    <link href="css/bootstrap.min.css" rel="stylesheet" />
    <script src="js/App.js"></script>
    <script src="node_modules/web3/dist/web3.min.js"></script>
    <link href="./css/aos.min.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"
      integrity="sha512-KfkfwYDsLkIlwQp6LFnl8zNdLGxu9YAA1QvwINks4PhcElQSvqcyVLLD9aMhXd13uQjoXtEKNosOWaZqXgel0g=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="icon" href="./assets/images/icon.png" />
    <title>Admin Dashboard</title>
  </head>

  <body>
    <!-- Loader -->
    <div class="loader-wraper">
      <div class="lds-roller">
        <div></div><div></div><div></div><div></div>
        <div></div><div></div><div></div><div></div>
      </div>
    </div>

    <!-- Scroll Button -->
    <div>
      <i onclick="topFunction()" id="scroll-btn" class="fa-solid fa-angle-up"></i>
    </div>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light py-3 navbar-dark">
      <div class="container">
        <a class="navbar-brand" href="index.html">
          <i class="fa-solid fa-dragon home_text"></i>
          <span class="home_text">Orio</span>Chain
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="upload.html">Upload</a></li>
            <li class="nav-item"><a class="nav-link" href="verify.html">Verify</a></li>
            <li class="nav-item"><a class="nav-link" href="delete.html">Delete</a></li>
            <li class="nav-item"><a class="nav-link active" href="admin.html">Admin</a></li>
            <li class="nav-item"><a class="nav-link" href="about.html">Team</a></li>
          </ul>

          <div class="d-flex">
            <button id="loginButton" onclick="connect()" class="btn main-button">Login</button>
            <button id="logoutButton" onclick="disconnect()" class="btn main-button">Logout</button>
          </div>
        </div>
      </div>
    </nav>

    <!-- Admin Dashboard -->
    <div class="container">
      <div class="alert alert-danger d-none mt-2">
        Please download MetaMask at
        <a target="_blank" href="https://metamask.io/download">Metamask Site</a>
      </div>

      <div class="row content m-1">
        <!-- Wallet Info -->
        <div data-aos="fade-down" class="box wallet-status col-lg-12 d-flex flex-column my-2">
          <i class="fa-brands fa-connectdevelop icon" aria-hidden="true"></i>
          <span id="userAddress" class="p-1">Address: <span class="text-warning">n/a</span></span>
          <span id="network" class="p-1">Network: <span class="text-warning">n/a</span></span>
          <span id="userBalance" class="p-1">Balance: <span class="text-warning">n/a</span></span>
          <span id="num-hashes" class="p-1"><span class="text-warning"></span></span>
          <span id="num-exporters" class="p-1"><span class="text-warning"></span></span>
        </div>

        <!-- Exporter Management -->
        <div data-aos="zoom-in" class="col-lg-6 py-3 data-upload my-3 mx-md-2">
          <input id="Exporter-address" type="text" placeholder="Exporter Address" required />
          <input id="info" type="text" placeholder="University" required />
          <span id="note" class="text-danger"></span>
          <img id="loader" class="d-none" src="files/loader.svg" alt="loader" />

          <div class="btn-container mt-3">
            <input
              onclick="addExporter()"
              class="btn btn-primary exporter-button main-button"
              type="submit"
              value="Add Exporter"
              id="ExporterBtn"
            />
            <input
              onclick="deleteExporter()"
              class="btn btn-danger exporter-button main-button"
              type="submit"
              value="Delete Exporter"
              id="delete"
            />
            <input
              onclick="editExporter()"
              class="btn btn-warning exporter-button main-button"
              type="submit"
              value="Edit Exporter"
              id="edit"
            />
          </div>
        </div>
      </div>
    </div>

    <!-- Contact Icon -->
    <div>
      <a href="mailto:devaloshe@gmail.com?subject=From OrioChain Site">
        <i class="mail-us fa-solid fa-headset"></i>
      </a>
    </div>

    <!-- Scripts -->
    <script src="./js/aos.js"></script>
    <script src="./js/script.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Inline Script -->
    <script defer>
      document.getElementById("Exporter-address").onclick = () => {
        $("#note").html(``);
        $("#ExporterBtn").attr("disabled", false);
        $("#edit").attr("disabled", false);
        $("#delete").attr("disabled", false);
      };
    </script>
  </body>
</html>
