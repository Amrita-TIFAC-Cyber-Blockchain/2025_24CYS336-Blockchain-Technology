<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlockVote: Enterprise E-Voting System</title>
  <script src="https://cdn.jsdelivr.net/npm/web3@1.7.0/dist/web3.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #121212;
    color: #e0e0e0;
    padding: 30px;
  }

  h2{
    color: #ff3b3b;
  font-family: 'Poppins', 'Segoe UI', sans-serif;
  font-size: 28px;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-shadow: 0 0 8px rgba(255, 59, 59, 0.4);
  margin-bottom: 10px;
  }
  h3 {
    color: #ff4c4c;
  font-family: 'Poppins', 'Segoe UI', sans-serif;
  font-weight: 600;
  font-size: 20px;
  letter-spacing: 0.3px;
  text-shadow: 0 0 3px rgba(255, 76, 76, 0.2); /* softer glow */
  margin-top: 25px;
  margin-bottom: 10px;
  }

  input, select {
    background: #1f1f1f;
    color: #fff;
    border: 1px solid #333;
    padding: 10px;
    border-radius: 6px;
    margin: 5px;
  }

  button {
    background: linear-gradient(45deg, #ff0000, #b30000);
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
    margin: 5px;
    transition: all 0.3s ease-in-out;
    box-shadow: 0 0 10px rgba(255, 0, 0, 0.3);
  }

  button:hover {
    background: linear-gradient(45deg, #b30000, #ff0000);
    transform: scale(1.05);
    box-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
  }

  button:active {
    transform: scale(0.98);
  }

  hr {
    border: 0;
    height: 1px;
    background: #333;
    margin: 20px 0;
  }

  #output {
    margin-top: 20px;
    background: #1e1e1e;
    padding: 15px;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(255, 0, 0, 0.2);
  }

  label {
    color: #ff9999;
  }

  select:focus, input:focus {
    outline: none;
    border-color: #ff4c4c;
    box-shadow: 0 0 5px #ff4c4c;
  }
</style>

</head>
<body>
  <h2>BlockVote: Enterprise E-Voting System</h2>

  <p><b>Connected Account:</b> <span id="account"></span></p>

  <div>
    <label>Contract Address:</label>
    <input type="text" id="contractAddress" size="60" placeholder="Enter deployed contract address">
    <button onclick="loadContract()">Load Contract</button>
  </div>

  <hr>

  <div id="votingSection" style="display:none;">
    <h3>Cast Your Vote</h3>
    <select id="candidateSelect"></select>
    <button onclick="voteCandidate()">Vote</button>
  </div>

  <div id="ownerSection" style="display:none;">
    <h3>Owner Controls</h3>
    <button onclick="endVoting()">End Voting</button>
  </div>

  <hr>

  <button onclick="showResults()">Show Results</button>
  <div id="output"></div>

  <script>
    let web3;
    let contract;
    let account;
    let owner;

    const abi = [ /* --- your existing ABI remains unchanged --- */ 
	{
		"inputs": [
			{
				"internalType": "uint256",
				"name": "numCandidates",
				"type": "uint256"
			},
			{
				"internalType": "string[]",
				"name": "names",
				"type": "string[]"
			}
		],
		"stateMutability": "nonpayable",
		"type": "constructor"
	},
	{
		"inputs": [
			{
				"internalType": "uint256",
				"name": "",
				"type": "uint256"
			}
		],
		"name": "candidateNames",
		"outputs": [
			{
				"internalType": "string",
				"name": "",
				"type": "string"
			}
		],
		"stateMutability": "view",
		"type": "function"
	},
	{
		"inputs": [],
		"name": "endVoting",
		"outputs": [],
		"stateMutability": "nonpayable",
		"type": "function"
	},
	{
		"inputs": [],
		"name": "getResults",
		"outputs": [
			{
				"internalType": "string[]",
				"name": "",
				"type": "string[]"
			},
			{
				"internalType": "uint256[]",
				"name": "",
				"type": "uint256[]"
			}
		],
		"stateMutability": "view",
		"type": "function"
	},
	{
		"inputs": [
			{
				"internalType": "address",
				"name": "",
				"type": "address"
			}
		],
		"name": "hasVoted",
		"outputs": [
			{
				"internalType": "bool",
				"name": "",
				"type": "bool"
			}
		],
		"stateMutability": "view",
		"type": "function"
	},
	{
		"inputs": [],
		"name": "owner",
		"outputs": [
			{
				"internalType": "address",
				"name": "",
				"type": "address"
			}
		],
		"stateMutability": "view",
		"type": "function"
	},
	{
		"inputs": [
			{
				"internalType": "string",
				"name": "candidateName",
				"type": "string"
			}
		],
		"name": "vote",
		"outputs": [],
		"stateMutability": "nonpayable",
		"type": "function"
	},
	{
		"inputs": [
			{
				"internalType": "string",
				"name": "",
				"type": "string"
			}
		],
		"name": "votesReceived",
		"outputs": [
			{
				"internalType": "uint256",
				"name": "",
				"type": "uint256"
			}
		],
		"stateMutability": "view",
		"type": "function"
	},
	{
		"inputs": [],
		"name": "votingEnded",
		"outputs": [
			{
				"internalType": "bool",
				"name": "",
				"type": "bool"
			}
		],
		"stateMutability": "view",
		"type": "function"
	}
];

    async function init() {
      if (window.ethereum) {
        web3 = new Web3(window.ethereum);
        await ethereum.request({ method: "eth_requestAccounts" });
        const accounts = await web3.eth.getAccounts();
        account = accounts[0];
        document.getElementById("account").innerText = account;

        window.ethereum.on("accountsChanged", (accs) => {
          account = accs[0];
          document.getElementById("account").innerText = account;
          if (contract) checkOwner();
        });
      } else {
        alert("Please install MetaMask!");
      }
    }

    async function loadContract() {
      const address = document.getElementById("contractAddress").value.trim();
      if (!address) return alert("Enter contract address!");
      contract = new web3.eth.Contract(abi, address);
      document.getElementById("output").innerHTML = `<b>Contract loaded at:</b> ${address}`;
      await loadCandidates();
      await checkOwner();
    }

    async function loadCandidates() {
      const select = document.getElementById("candidateSelect");
      select.innerHTML = "";
      let index = 0;
      try {
        while (true) {
          const name = await contract.methods.candidateNames(index).call();
          const opt = document.createElement("option");
          opt.textContent = name;
          opt.value = name;
          select.appendChild(opt);
          index++;
        }
      } catch (err) {
        if (index === 0) alert("No candidates found!");
      }
      document.getElementById("votingSection").style.display = "block";
    }

    async function checkOwner() {
      owner = await contract.methods.owner().call();
      if (owner.toLowerCase() === account.toLowerCase()) {
        document.getElementById("ownerSection").style.display = "block";
      } else {
        document.getElementById("ownerSection").style.display = "none";
      }
    }

    async function voteCandidate() {
      const candidate = document.getElementById("candidateSelect").value;
      try {
        await contract.methods.vote(candidate).send({ from: account });
        document.getElementById("output").innerHTML = 
          `<b>✅ Your vote has been successfully cast!</b><br>Address: ${account}`;
      } catch (err) {
        if (err.message.includes("No double voting allowed")) {
          alert("⚠️ You have already voted! Double voting is not allowed.");
        } else if (err.message.includes("Voting has ended")) {
          alert("⚠️ The voting period is already over.");
        } else if (err.message.includes("Invalid candidate")) {
          alert("⚠️ Invalid candidate name entered.");
        } else {
          alert("❌ Error while voting: " + err.message);
        }
      }
    }

    async function endVoting() {
      try {
        await contract.methods.endVoting().send({ from: account });
        document.getElementById("output").innerHTML = "<b>🛑 Voting has been ended by the owner.</b>";
      } catch (err) {
        if (err.message.includes("Only the owner can end the election")) {
          alert("⚠️ Only the owner can end the election!");
        } else {
          alert("❌ Error ending voting: " + err.message);
        }
      }
    }

    async function showResults() {
      try {
        const resultsDiv = document.getElementById("output");
        const result = await contract.methods.getResults().call({ from: account });

        const names = result[0] || result.names;
        const votes = result[1] || result.votes;

        resultsDiv.innerHTML = "<h3>Election Results</h3><ul>";
        let maxVotes = 0;
        let winners = [];

        for (let i = 0; i < names.length; i++) {
          const voteCount = parseInt(votes[i]);
          resultsDiv.innerHTML += `<li>${names[i]} — ${voteCount} votes</li>`;

          if (voteCount > maxVotes) {
            maxVotes = voteCount;
            winners = [names[i]];
          } else if (voteCount === maxVotes) {
            winners.push(names[i]);
          }
        }

        resultsDiv.innerHTML += "</ul>";

        if (maxVotes === 0) {
          resultsDiv.innerHTML += "<p>No votes have been cast yet.</p>";
        } else if (winners.length === 1) {
          resultsDiv.innerHTML += `<p>🏆 <strong>Winner:</strong> ${winners[0]}</p>`;
        } else {
          resultsDiv.innerHTML += `<p>⚖️ The candidates ${winners.join(", ")} share the highest votes (${maxVotes} each).</p>`;
        }
      } catch (err) {
        if (err.message.includes("Voting not ended yet")) {
          alert("⚠️ Voting is still in progress. Please end the election first.");
        } else if (err.message.includes("Only the owner can view results")) {
          alert("⚠️ Only the election owner can view results.");
        } else {
          alert("❌ Error fetching results: " + err.message);
        }
      }
    }

    window.addEventListener("load", init);
  </script>
</body>
</html>
