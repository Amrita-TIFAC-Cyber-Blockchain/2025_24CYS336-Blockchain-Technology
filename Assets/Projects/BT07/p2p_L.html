        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        .card {
            background: #fff;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 12px;
            box-shadow: 0px 2px 12px rgba(0,0,0,0.1);
        }

        .title {

            font-size: 22px;

        }

            display: block;
            margin-top: 8px;
        }

            border: 1px solid #ccc;

        }

            background: #276ef1;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 15px;
            border-radius: 6px;
        }

        button:hover {
            background: #1a56c2;
        }

        .output-box {

            color: #0f0;
            padding: 20px;
            border-radius: 8px;
            white-space: pre-wrap;

}

}

.badge-lender {

}

<!-- Contract Setup -->
<div class="card">
    <div class="title">📄 Contract Setup</div>

<!-- Request Loan -->
<div class="card">
    <div class="title">💰 Request Loan (Values in Wei)</div>

    <label>Amount (Wei):</label>
    <input id="req_amount" type="text" placeholder="Example: 1000000000000000000">

    <label>Interest (bps):</label>
    <input id="req_interest" type="text" placeholder="Example: 500 for 5%">

    <label>Term (seconds):</label>
    <input id="req_term" type="text" placeholder="Example: 600 (10 mins)">

    <button onclick="requestLoan()">Request Loan</button>

    <p id="loan_id_display" class="success"></p>
    

</div>

<!-- Fund Loan -->
<div class="card">
    <div class="title">🏦 Fund Loan (Use Wei)</div>

    <label>Loan ID:</label>
    <input id="fund_id" type="text">

    <label>Amount (Wei):</label>
    <input id="fund_amt" type="text">

    <button onclick="fundLoan()">Fund Loan</button>

</div>

<!-- Withdraw -->
<div class="card">
    <div class="title">📤 Borrower Withdraw Funds</div>

    <label>Loan ID:</label>
    <input id="wd_id" type="text">

    <button onclick="withdrawLoanFunds()">Withdraw</button>
</div>

<!-- Repay -->
<div class="card">
    <div class="title">💸 Repay Loan</div>

    <label>Loan ID:</label>
    <input id="repay_id" type="text">

    <label>Repay Amount (Wei):</label>
    <input id="repay_amt" type="text">

    <button onclick="repayLoan()">Repay</button>
</div>

<!-- Lender Withdraw -->
<div class="card">
    <div class="title">📥 Lender Withdraw Proceeds</div>

    <label>Loan ID:</label>
    <input id="lp_id" type="text">

    <button onclick="withdrawLenderProceeds()">Withdraw Proceeds</button>
</div>

<!-- Cancel Loan -->
<div class="card">
    <div class="title">❌ Cancel Loan</div>

    <label>Loan ID:</label>
    <input id="cancel_id" type="text">

    <button onclick="cancelLoan()">Cancel Loan</button>
</div>

<!-- View Loan -->
<div class="card">
    <div class="title">🔍 View Loan Details</div>

    <label>Loan ID:</label>
    <input id="view_id" type="text">

    <button onclick="viewLoan()">View</button>

    <div id="loan_output" class="output-box"></div>

</div>

async function connect() {
    if (window.ethereum) {
        web3 = new Web3(window.ethereum);
        let accounts = await ethereum.request({ method: "eth_requestAccounts" });
        account = accounts[0];
        document.getElementById("account").innerText = "Connected: " + account;
    }
}

async function loadContract() {
    let addr = document.getElementById("contract_address").value.trim();
    contract = new web3.eth.Contract(ABI, addr);
    document.getElementById("contract_status").innerText = "Contract Loaded Successfully!";
    updateIdentity();
}

async function requestLoan() {
    let amount = document.getElementById("req_amount").value;
    let interest = document.getElementById("req_interest").value;
    let term = document.getElementById("req_term").value;

    await contract.methods.requestLoan(amount, interest, term)
        .send({ from: account })
        .on("receipt", function (receipt) {
            const event = receipt.events.LoanRequested;
            const loanId = event.returnValues.loanId;
            document.getElementById("loan_id_display").innerText = "Generated Loan ID: " + loanId;
            document.getElementById("fund_id").value = loanId;
            document.getElementById("wd_id").value = loanId;
            document.getElementById("repay_id").value = loanId;
            document.getElementById("lp_id").value = loanId;
            document.getElementById("cancel_id").value = loanId;
            document.getElementById("view_id").value = loanId;
            updateIdentity();
        });
}

async function fundLoan() {
    let loanId = document.getElementById("fund_id").value;
    let amt = document.getElementById("fund_amt").value;
    await contract.methods.fundLoan(loanId).send({ from: account, value: amt });
    updateIdentity();
}

async function withdrawLoanFunds() {
    let loanId = document.getElementById("wd_id").value;
    await contract.methods.withdrawLoanFunds(loanId).send({ from: account });
    updateIdentity();
}

async function repayLoan() {
    let loanId = document.getElementById("repay_id").value;
    let amt = document.getElementById("repay_amt").value;
    await contract.methods.repayLoan(loanId).send({ from: account, value: amt });
    updateIdentity();
}

async function withdrawLenderProceeds() {
    let loanId = document.getElementById("lp_id").value;
    await contract.methods.withdrawLenderProceeds(loanId).send({ from: account });
}

async function cancelLoan() {
    let loanId = document.getElementById("cancel_id").value;
    await contract.methods.cancelLoan(loanId).send({ from: account });
    updateIdentity();
}

async function viewLoan() {
    let loanId = document.getElementById("view_id").value;
    let loan = await contract.methods.loans(loanId).call();
    let lenders = await contract.methods.getLenders(loanId).call();

    // Timestamp
    let readableDate = new Date(loan.termEnds * 1000).toLocaleString();

    // Status badges
    let fundedStatus = loan.funded 
        ? `<span class="status-funded">✔ Funded</span>` 
        : `<span class="status-notfunded">✖ Not Funded</span>`;

    let withdrawnStatus = loan.withdrawn
        ? `<span class="status-withdrawn">✔ Withdrawn</span>`
        : `<span class="status-notfunded">✖ Not Withdrawn</span>`;

    let repaidStatus = loan.repaid
        ? `<span class="status-repaid">✔ Repaid</span>`
        : `<span class="status-notrepaid">✖ Not Repaid</span>`;

    // Identity within this loan
    let role = "None";
    let roleBadge = "";

    if (loan.borrower.toLowerCase() === account.toLowerCase()) {
        role = "You are the BORROWER of this loan";
        roleBadge = `<span class="identity-badge badge-borrower">${role}</span>`;
    }
    else if (lenders.map(a => a.toLowerCase()).includes(account.toLowerCase())) {
        role = "You are a LENDER in this loan";
        roleBadge = `<span class="identity-badge badge-lender">${role}</span>`;
    }
    else {
        role = "You are NOT part of this loan";
        roleBadge = `<span class="identity-badge badge-none">${role}</span>`;
    }

    // Build clean UI
    let html = `
        <b>Loan ID:</b> ${loan.id}<br><br>

        ${roleBadge}<br><br>

        <b>Borrower:</b><br>${loan.borrower}<br><br>

        <b>Amount (Wei):</b> ${loan.amount}<br>
        <b>Funded Amount (Wei):</b> ${loan.fundedAmount}<br>
        <b>Interest (bps):</b> ${loan.interestBps}<br><br>

        <b>Term Ends:</b> ${readableDate}<br><br>

        <b>Status:</b><br>
        • ${fundedStatus}<br>
        • ${withdrawnStatus}<br>
        • ${repaidStatus}<br>
    `;

    document.getElementById("loan_output").innerHTML = html;
}

async function updateIdentity() {
    if (!contract || !account) return;

    let totalLoans = await contract.methods.nextLoanId().call();

    let isBorrower = false;
    let isLender = false;

    for (let i = 1; i < totalLoans; i++) {
        let loan = await contract.methods.loans(i).call();

        if (loan.borrower.toLowerCase() === account.toLowerCase()) {
            isBorrower = true;
        }

        let lenders = await contract.methods.getLenders(i).call();
        if (lenders.map(a => a.toLowerCase()).includes(account.toLowerCase())) {
            isLender = true;
        }
    }

    let badge = document.getElementById("identity_role");

    if (isBorrower && isLender) {
        badge.innerHTML = "Role: Borrower & Lender";
        badge.className = "identity-badge badge-borrower"; // high priority
    }
    else if (isBorrower) {
        badge.innerHTML = "Role: Borrower";
        badge.className = "identity-badge badge-borrower";
    }
    else if (isLender) {
        badge.innerHTML = "Role: Lender";
        badge.className = "identity-badge badge-lender";
    }
    else {
        badge.innerHTML = "Role: None (No actions yet)";
        badge.className = "identity-badge badge-none";
    }
}
